<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1240px; height:344px; overflow:hidden; background:#FFFBF4;
         font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         display:flex; align-items:center; justify-content:center; }
  .row { display:flex; gap:18px; }
  .c { width:176px; height:258px; background:#fff; border-radius:16px;
       box-shadow:0 10px 28px rgba(90,60,30,.10); padding:0 14px 14px; overflow:hidden;
       display:flex; flex-direction:column; }
  .bar { height:7px; margin:0 -14px 0; }
  .e { font-size:36px; margin-top:18px; }
  .n { font-size:16px; font-weight:900; margin-top:8px; color:#2B2118; letter-spacing:.2px; }
  .t { font-size:10.5px; color:#9A8A78; margin-top:3px; line-height:1.5; min-height:28px; }
  .mini { margin-top:16px; display:flex; flex-direction:column; gap:7px; }
  .m { display:flex; align-items:center; gap:6px; }
  .m .l { font-size:9px; color:#B4A594; width:20px; }
  .m .tr { flex:1; height:6px; background:#F5EEE4; border-radius:4px; overflow:hidden; }
  .m .f { height:100%; border-radius:4px; }
</style>
</head>
<body>
  <div class="row">
    <div class="c">
      <div class="bar" style="background:#FFC72C"></div>
      <div class="e">🍟</div><div class="n">薯条元气型</div><div class="t">社交电池永远满格</div>
      <div class="mini">
        <div class="m"><span class="l">分享</span><div class="tr"><div class="f" style="width:95%;background:#FFC72C"></div></div></div>
        <div class="m"><span class="l">治愈</span><div class="tr"><div class="f" style="width:70%;background:#FFC72C"></div></div></div>
        <div class="m"><span class="l">饱腹</span><div class="tr"><div class="f" style="width:60%;background:#FFC72C"></div></div></div>
      </div>
    </div>
    <div class="c">
      <div class="bar" style="background:#DA291C"></div>
      <div class="e">🍔</div><div class="n">巨无霸稳健型</div><div class="t">靠谱本谱，抗饿担当</div>
      <div class="mini">
        <div class="m"><span class="l">饱腹</span><div class="tr"><div class="f" style="width:96%;background:#DA291C"></div></div></div>
        <div class="m"><span class="l">治愈</span><div class="tr"><div class="f" style="width:65%;background:#DA291C"></div></div></div>
        <div class="m"><span class="l">冰爽</span><div class="tr"><div class="f" style="width:62%;background:#DA291C"></div></div></div>
      </div>
    </div>
    <div class="c">
      <div class="bar" style="background:#E82A1E"></div>
      <div class="e">🌶️</div><div class="n">麦辣热血型</div><div class="t">无辣不欢的行动派</div>
      <div class="mini">
        <div class="m"><span class="l">辣度</span><div class="tr"><div class="f" style="width:98%;background:#E82A1E"></div></div></div>
        <div class="m"><span class="l">分享</span><div class="tr"><div class="f" style="width:70%;background:#E82A1E"></div></div></div>
        <div class="m"><span class="l">冰爽</span><div class="tr"><div class="f" style="width:55%;background:#E82A1E"></div></div></div>
      </div>
    </div>
    <div class="c">
      <div class="bar" style="background:#F5A623"></div>
      <div class="e">🍗</div><div class="n">麦乐鸡治愈型</div><div class="t">温柔的小确幸收藏家</div>
      <div class="mini">
        <div class="m"><span class="l">治愈</span><div class="tr"><div class="f" style="width:97%;background:#F5A623"></div></div></div>
        <div class="m"><span class="l">甜度</span><div class="tr"><div class="f" style="width:65%;background:#F5A623"></div></div></div>
        <div class="m"><span class="l">饱腹</span><div class="tr"><div class="f" style="width:60%;background:#F5A623"></div></div></div>
      </div>
    </div>
    <div class="c">
      <div class="bar" style="background:#2B8CC4"></div>
      <div class="e">🥤</div><div class="n">冰可乐清爽型</div><div class="t">理性轻盈的效率控</div>
      <div class="mini">
        <div class="m"><span class="l">冰爽</span><div class="tr"><div class="f" style="width:98%;background:#2B8CC4"></div></div></div>
        <div class="m"><span class="l">饱腹</span><div class="tr"><div class="f" style="width:70%;background:#2B8CC4"></div></div></div>
        <div class="m"><span class="l">治愈</span><div class="tr"><div class="f" style="width:55%;background:#2B8CC4"></div></div></div>
      </div>
    </div>
    <div class="c">
      <div class="bar" style="background:#E94E77"></div>
      <div class="e">🍦</div><div class="n">甜筒小确幸型</div><div class="t">及时行乐的甜党</div>
      <div class="mini">
        <div class="m"><span class="l">甜度</span><div class="tr"><div class="f" style="width:99%;background:#E94E77"></div></div></div>
        <div class="m"><span class="l">治愈</span><div class="tr"><div class="f" style="width:75%;background:#E94E77"></div></div></div>
        <div class="m"><span class="l">分享</span><div class="tr"><div class="f" style="width:65%;background:#E94E77"></div></div></div>
      </div>
    </div>
  </div>
</body>
</html>
